<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">إضافة منتج جديد - TechnoBox</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="logo">TechnoBox</div>
        <nav>
            <a href="admin.html" class="btn">العودة للوحة التحكم</a>
        </nav>
    </header>

    <main>
        <h1 id="formTitle">إضافة منتج جديد</h1>
        <form id="productForm">
            <input type="hidden" id="productId">
            
            <div class="form-group">
                <label for="productName">اسم المنتج:</label>
                <input type="text" id="productName" required>
            </div>
            
            <div class="form-group">
                <label for="productDescription">وصف المنتج:</label>
                <textarea id="productDescription" required></textarea>
            </div>
            
            <div class="form-group">
                <label for="productImage">صورة المنتج:</label>
                <input type="file" id="productImage" accept="image/*">
                <img id="productImagePreview" class="image-preview">
            </div>
            
            <div class="form-group">
                <label for="productPrice">السعر (ر.س):</label>
                <input type="number" id="productPrice" required>
            </div>
            
            <div class="form-group">
                <label for="productQuantity">الكمية المتاحة:</label>
                <input type="number" id="productQuantity" required>
            </div>
            
            <div class="form-actions">
                <button type="submit" class="btn btn-save">حفظ</button>
                <button type="button" class="btn btn-cancel" onclick="window.location.href='admin.html'">إلغاء</button>
            </div>
        </form>
    </main>

    <script src="admin.js"></script>
</body>
</html>
