<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إضافة منتج جديد - TechnoBox</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="logo">TechnoBox</div>
        <nav>
            <a href="admin.html">← العودة</a>
        </nav>
    </header>

    <main>
        <h1>إضافة منتج جديد</h1>
        <form id="productForm">
            <div class="form-group">
                <label for="productName">اسم المنتج:</label>
                <input type="text" id="productName" required>
            </div>
            
            <div class="form-group">
                <label for="productDescription">وصف المنتج:</label>
                <textarea id="productDescription" required></textarea>
            </div>
            
            <div class="form-group">
                <label for="productImage">صورة المنتج:</label>
                <input type="file" id="productImage" accept="image/*" required>
                <img id="productImagePreview" style="display:none; max-width:200px; margin-top:1rem;">
            </div>
            
            <div class="form-group">
                <label for="productPrice">السعر (ر.س):</label>
                <input type="number" id="productPrice" required>
            </div>
            
            <div class="form-group">
                <label for="productQuantity">الكمية:</label>
                <input type="number" id="productQuantity" required>
            </div>

            <button type="submit" class="btn">حفظ المنتج</button>
        </form>
    </main>

    <script src="admin.js"></script>
</body>
</html>
